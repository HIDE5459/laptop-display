name: Build (dmg / exe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg
            artifact: LaptopDisplay-mac-dmg
            pattern: dist/*.dmg
          - os: windows-latest
            args: --win nsis
            artifact: LaptopDisplay-win-exe
            pattern: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native helpers (macOS)
        if: runner.os == 'macOS'
        run: |
          clang -O2 -fobjc-arc -framework Foundation -framework CoreGraphics \
            tools/mac/virtual-display.m -o build/VirtualDisplay
          clang -O2 -framework CoreGraphics \
            tools/mac/cursor-move.m -o build/CursorMove
          clang -O2 -framework ApplicationServices \
            tools/mac/modifier-tap.m -o build/ModifierTap

      # Developer ID の証明書と Apple ID をシークレットに登録してあれば
      # 署名 + 公証まで行う。無ければ未署名でビルドする(警告は出るが動く)。
      # シークレットは MAC_ 接頭辞付きで受け取り、署名する場合にだけ
      # electron-builder が見る名前 (CSC_LINK など) に移す。
      # 空の CSC_LINK を渡すと証明書のパスとして解決されてビルドが失敗するため。
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_APPLE_ID" ]; then
            echo "署名 + 公証ありでビルドします"
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
            npx electron-builder ${{ matrix.args }} --publish never
          else
            echo "証明書が未設定のため未署名でビルドします (ad-hoc 署名のみ)"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder ${{ matrix.args }} --publish never \
              --config.mac.notarize=false \
              --config.mac.hardenedRuntime=false
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # ビルド済みの dmg / exe を GitHub Release に添付して、
  # Releases ページから直接ダウンロードできるようにする
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LaptopDisplay(最新ビルド)
          body: |
            Mac の画面を Windows ノートに低遅延ストリーミングしてサブディスプレイ化するアプリ。

            - **LaptopDisplay-*-arm64.dmg** — Mac (Apple Silicon) 用・送信側
            - **LaptopDisplay Setup *.exe** — Windows 10/11 (x64) 用・受信側

            未署名ビルドのため初回起動時: Mac は右クリック→「開く」、
            Windows は SmartScreen で「詳細情報」→「実行」。
            使い方は README を参照してください。
          files: dist/**
          make_latest: true
