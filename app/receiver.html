<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LaptopDisplay — 受信</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; background: #000; min-height: 0; }
  #screen { width: 100%; height: 100%; object-fit: contain; display: block; }

  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); z-index: 5;
  }
  #overlay.hidden { display: none; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlayMsg { color: var(--muted); }
  #manualRow { display: flex; gap: 8px; margin-top: 6px; }

  #toolbar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; z-index: 10;
    background: rgba(15, 18, 22, 0.85); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 10px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
    backdrop-filter: blur(8px);
  }
  #stage:hover #toolbar, #toolbar.pin { opacity: 1; pointer-events: auto; }
  #toolbar button {
    font: inherit; font-size: 12.5px; border: none; background: transparent;
    color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  #toolbar button:hover { color: var(--text); background: var(--panel-2); }
  #toolbar .sep { width: 1px; height: 16px; background: var(--border); }
  #srcName { font-size: 12px; color: var(--faint); padding: 0 6px; max-width: 220px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #stats {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    background: rgba(15, 18, 22, 0.85); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--muted);
    display: none; min-width: 150px; line-height: 1.9;
    backdrop-filter: blur(8px);
  }
  #stats.show { display: block; }
  #stats b { color: var(--text); font-weight: 600; float: right; margin-left: 14px; }
</style>
</head>
<body>
  <div id="stage">
    <video id="screen" autoplay muted playsinline></video>

    <div id="overlay">
      <div class="logo" style="width:40px;height:40px;border-radius:11px;font-size:16px;">LD</div>
      <div class="spinner"></div>
      <div id="overlayMsg">Mac 側 (LaptopDisplay) を探しています…</div>
      <div id="manualRow">
        <input class="field" id="manualIp" placeholder="IP を直接入力 (例: 192.168.100.1)" size="26">
        <button class="btn" id="manualBtn">接続</button>
      </div>
    </div>

    <div id="toolbar">
      <span id="srcName"></span>
      <div class="sep"></div>
      <button id="fsBtn">全画面 (F)</button>
      <button id="statsBtn">統計 (S)</button>
    </div>

    <div id="stats">
      解像度 <b id="stRes">—</b><br>
      フレームレート <b id="stFps">—</b><br>
      ビットレート <b id="stBr">—</b><br>
      遅延 (RTT) <b id="stRtt">—</b>
    </div>
  </div>

<script src="receiver.js"></script>
</body>
</html>
