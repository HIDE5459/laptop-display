<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LaptopDisplay — 受信</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; }
  /* flex ではなくビューポート全体に固定する。レイアウトのはみ出しで
     映像の上下が欠けることがないようにするため。 */
  #stage { position: fixed; inset: 0; background: #000; }
  #screen { width: 100%; height: 100%; display: block; object-fit: contain; }
  /* 表示の合わせ方を切り替える (Z キー / ツールバー) */
  #screen.fit-cover { object-fit: cover; }   /* 画面いっぱい (端が切れる) */
  #screen.fit-fill { object-fit: fill; }     /* 引き伸ばす (比率が変わる) */

  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); z-index: 5;
  }
  #overlay.hidden { display: none; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlayMsg { color: var(--muted); }
  #manualRow { display: flex; gap: 8px; margin-top: 6px; }

  #toolbar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; z-index: 10;
    background: rgba(15, 18, 22, 0.85); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 10px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
    backdrop-filter: blur(8px);
  }
  #toolbar.show { opacity: 1; pointer-events: auto; }
  /* 操作していない間はカーソルも消して、純粋なディスプレイとして使えるようにする */
  #stage.idle { cursor: none; }
  #toolbar button {
    font: inherit; font-size: 12.5px; border: none; background: transparent;
    color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  #toolbar button:hover { color: var(--text); background: var(--panel-2); }
  #toolbar .sep { width: 1px; height: 16px; background: var(--border); }
  #srcName { font-size: 12px; color: var(--faint); padding: 0 6px; max-width: 220px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #stats {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    background: rgba(15, 18, 22, 0.85); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--muted);
    display: none; min-width: 150px; line-height: 1.9;
    backdrop-filter: blur(8px);
  }
  #stats.show { display: block; }
  #stats b { color: var(--text); font-weight: 600; float: right; margin-left: 14px; }
</style>
</head>
<body>
  <div id="stage">
    <video id="screen" autoplay muted playsinline></video>

    <div id="overlay">
      <div class="logo" style="width:40px;height:40px;border-radius:11px;font-size:16px;">LD</div>
      <div class="spinner"></div>
      <div id="overlayMsg">Mac 側 (LaptopDisplay) を探しています…</div>
      <div id="manualRow">
        <input class="field" id="manualIp" placeholder="Mac の IP を入力 (例: 192.168.1.5)" size="26">
        <button class="btn" id="manualBtn">接続</button>
      </div>
      <label class="status-sub" id="autoLaunchRow"
             style="display:none;align-items:center;gap:7px;cursor:pointer;margin-top:4px">
        <input type="checkbox" id="autoLaunchChk">
        この PC の起動時に自動で起動する(常駐)
      </label>
      <div id="roleRow" style="display:none;align-items:center;gap:8px;margin-top:2px">
        <span class="status-sub">この PC の役割:</span>
        <select class="field" id="roleSel">
          <option value="receiver">ディスプレイ(画面を表示する)</option>
          <option value="sender">ホスト(画面を配信する)</option>
        </select>
      </div>
      <p class="hint" style="max-width:31rem;text-align:center;line-height:1.8">
        Tailscale・VPN 経由やゲスト Wi-Fi では自動検出(ブロードキャスト)が通らないため、
        Mac の IP を直接入力してください。Tailscale の場合は Mac で
        <code>tailscale ip -4</code> を実行して出る 100.x.y.z です。
        一度つながれば次回から自動で再接続します。
      </p>
    </div>

    <div id="toolbar">
      <span id="srcName"></span>
      <div class="sep"></div>
      <button id="fsBtn">全画面 (F)</button>
      <button id="fitBtn">表示: 合わせる (Z)</button>
      <button id="statsBtn">統計 (S)</button>
    </div>

    <div id="stats">
      映像の解像度 <b id="stRes">—</b><br>
      この画面の表示領域 <b id="stView">—</b><br>
      フレームレート <b id="stFps">—</b><br>
      ビットレート <b id="stBr">—</b><br>
      遅延 (RTT) <b id="stRtt">—</b>
    </div>
  </div>

<script src="receiver.js"></script>
</body>
</html>
